schema_version: 1
run_id: vos-YYYYMMDD-HHMMSS-zone
started_at: null
completed_at: null
command: Run COMPASS Verified Opportunity Search.
mode: primary
framework_version: null
registry_revision_before: null
registry_revision_after: null

result_limits:
  max_primary_results: null
  max_contract_results: null

telemetry:
  targets:
    unique_opportunities_discovered: null
    materially_inspected: null
    consecutive_no_yield_passes: null
  actual:
    source_hits_observed: null
    unique_opportunities_discovered: 0
    quick_screened: 0
    materially_inspected: 0
    live_verified: 0
    reported: 0
  coverage:
    source_families: []
    title_families: []
    query_bundles: []
    # One record per applicable required source and selected rotating source.
    # Allowed statuses: completed, completed_via_substitution,
    # blocked_unsubstituted, skipped, not_applicable.
    source_attempts: []
    # Each summary identifies the tier/window, runs evaluated, required sources,
    # satisfied sources, missing sources, and PASS/FAIL/UNKNOWN status.
    rotation_windows: []
  gates:
    numeric_breadth: NOT_CONFIGURED
    source_coverage: NOT_CONFIGURED
    title_family_coverage: NOT_CONFIGURED
    telemetry_reconciliation: UNKNOWN
  expansion_passes: []
  breadth_status: not_configured
  stop_reason: null
  limitations: []
  reconciliation:
    status: UNKNOWN
    checks: []

results:
  # One record per materially inspected opportunity. Each record must have exactly one terminal disposition.
  considered: []
  reported: []
  excluded: []
  suppressed_as_previously_handled: []
  consolidated_as_duplicates: []
  materially_changed: []

# Store the intended registry delta so a failed registry update can be replayed.
registry_delta:
  added: []
  updated: []
  unchanged: []

persistence:
  run_log_created: false
  registry_updated: false
  verified_after_write: false
  status: not_attempted
  errors: []
